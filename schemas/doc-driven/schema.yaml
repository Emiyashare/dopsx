name: doc-driven
version: 1
description: 文书工作流程（dopsx）- proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: 提案：这件文书工作做什么、给谁、期限
    template: proposal.md
    instruction: |
      写清楚这件文书工作「为什么做、做什么」。后面三份计划文件都以它为基础。

      各部分：
      - **为什么要做**：一两句话说明背景：谁需要、用来做什么、为什么现在做。
      - **做什么**：列出要制作或处理的每一份文书：文书名称、给谁（提交对象或收件人）、期限。
      - **要求**：列出这件工作需要核对的要求类别，每一类对应一份 `specs/<路径>/spec.md`。
        - **新增要求**：要求库里还没有的类别。路径每段只用小写英文、数字和短横线（例如 `company-setup/registration`、`notary/articles-certification`、`invoice/qualified-invoice`）。先查看 `openspec/specs/` 里已有的路径，沿用已有的分类方式。
        - **修改已有要求**：要求库里已有、但这次内容有变化的类别，使用 `openspec/specs/` 下的原路径。没有就留空。
        - 如果这件工作没有任何需要核对的要求（例如一张常规请求书、一封普通信件），这一部分写「无」，并在本工作的 `.openspec.yaml` 末尾加一行 `skip_specs: true`。不要为了凑数编造要求。
      - **成果物**：正式版保存在与 `openspec/` 同级的 `documents/<工作名>/`，列出最终要放进去的每个文件名。草稿和过程材料留在工作文件夹里，不写在这里。
      - **前提与待确认**：已知的前提（客户已提供的资料、已有的文件、已经决定的事）；还没确认的事项逐条列出，不要猜。

      注意：
      - 账号、密码、暗证番号等凭证不要写进任何计划文件。
      - 案件当事人的姓名、住址可以写在这里（只保存在本机的工作文件夹里），但不要写进 specs。
      - 保持简洁，一两页以内。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 要求：文书必须满足的规定（官方规定、客户要求、格式要求）
    template: spec.md
    instruction: |
      为 proposal「要求」部分列出的每一类，写一份要求文件 `specs/<路径>/spec.md`。
      要求写的是「文书必须满足什么」，不是「怎么做」：做法写在 design，步骤写在 tasks。

      适合写进要求的内容：
      - 官方规定：必须附的文件、必须写明的事项、期限、格式、份数、有效期（例如「印鉴证明须为发行后3个月以内」）
      - 客户提出的要求：必须写进去的条款、必须用的格式
      - 公司内部的格式要求：命名、字体、用纸

      每一条要求：
      - 以 `### Requirement: <要求名称>` 开头，下一行写要求内容。内容中 MUST 含英文关键字 SHALL 或 MUST（例如「设立登记申请 MUST 附本店所在场所决定书」），否则严格校验会报警告。
      - 要求内容下面单独写一行出处：`出处：<官方网页链接或文件名称>（确认日期：YYYY-MM-DD）`。官方规定 MUST 来自官方来源（官公署、官方指南页面），不要凭记忆写。客户或公司内部的要求写明来源，例如 `出处：客户邮件（确认日期：2026-09-10）`。
      - 至少一个场景：`#### Scenario: <场景名>`（MUST 用四个 #），下面两行 `- **WHEN** <条件>` 和 `- **THEN** <结果>`。场景要能用来验收，例如「WHEN 定款只写到市区町村 THEN 申请时必须另附本店所在场所决定书」。

      路径（`<路径>` 是 `specs/` 下面的目录）：
      - 新增类别用 proposal 里写的路径，每段只用小写英文、数字和短横线。沿用要求库已有的分类方式，不要随意新加层级。
      - 修改已有类别，用 `openspec/specs/` 下的原路径，不要改名或挪位置。

      新增类别的文件以 `## Purpose` 开头，写一两句话（50 个字符以上）说明这类要求管什么。修改已有类别时不要写 `## Purpose`。

      用以下标题区分增、改、删、改名：
      - `## ADDED Requirements`：新增
      - `## MODIFIED Requirements`：修改。MUST 先从 `openspec/specs/<路径>/spec.md` 把整条要求（从 `### Requirement:` 到它的全部场景）复制过来再改，标题文字保持一致
      - `## REMOVED Requirements`：删除。MUST 写明 **Reason**（原因）和 **Migration**（今后怎么办）
      - `## RENAMED Requirements`：只改名，用 FROM:/TO: 格式

      个人信息：
      - 要求文件 SHALL NOT 含任何案件当事人的个人信息（姓名、住址、生日、证件号、账户、电话、邮箱、密码等）。要求写的是可以用在任何客户身上的规定。
      - 需要指代具体的人时，用「客户」「代表者」「发起人」这类称呼。

      如果 proposal 的「要求」写的是「无」，并且 `.openspec.yaml` 设置了 `skip_specs: true`，就不要创建任何要求文件。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 做法：官方样本、签名方式、提交方式、命名与格式
    template: design.md
    instruction: |
      写清楚这件文书工作「怎么做」。

      各部分：
      - **背景**：与做法有关的现状和限制（已有资料、客户情况、官方要求的要点）。动机见 proposal，不要重复。
      - **做法**：每份文书怎么做：采用哪个官方样本（写明来源链接）或我们哪份旧文件做底版；格式（文件格式、用纸、字体）；签名方式（电子签名／亲笔签名／盖章）；提交方式（在线／窗口／邮寄／邮件）；文件命名。
      - **决定**：已经决定的事项、理由、考虑过的其他选项。
      - **预期的空白**：故意留空、等签署或提交时才填的地方（例如日期、签名栏），写明是哪份文书的哪一处。验收时不会把这些当成问题。没有就写「无」。
      - **风险**：可能出问题的地方和应对，格式：[风险] → 应对。
      - **待确认**：还没有答复的问题，每条一行，用 `- [ ]` 开头；答复后改成 `- [x]`，并在后面写上答复。只要还有一条 `- [ ]`，这件工作就不能归档。没有就写「无」。

      如果某个待确认的问题会改变要求、做法或清单，先向用户问清楚，不要带着猜测往下写。
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 清单：材料与步骤，每项标明负责人和完成判断
    template: tasks.md
    instruction: |
      把这件文书工作拆成可以逐项完成的清单。

      写清单之前，先看 design 的「待确认」：如果有会改变清单的问题没答复，先向用户问清楚。

      **严格按照模板格式。** 执行阶段靠复选框统计进度，不是 `- [ ]` 格式的行不会被计入。

      每一项：
      - MUST 是复选框：`- [ ] X.Y 【负责人】事项；完成判断：…`
      - 负责人只能是三种之一，写在编号后面：`【我方】`（我们来做）、`【客户】`（客户本人来做，例如提供资料、电子签名、到场）、`【官方】`（等官公署、银行等处理，例如受理、审查、发证）。
      - MUST 写明完成判断：怎样算完成（例如「正式版已保存为 documents/<工作名>/就任承諾書.pdf」「收到发行日期在3个月以内的扫描件」）。
      - 需要客户账号或密码的步骤，只写「由客户本人操作」或凭证存放的位置，不写凭证内容。

      分组与顺序：
      - 用 `## 1. …` 这样带编号的标题分组（例如：准备材料、制作文书、签署与提交、收尾）。
      - 按先后顺序排列，先要拿到的材料放前面。
      - 制作正式版的项目，写明保存到 `documents/<工作名>/` 的文件名。
      - 如果正式版还要另存一份到别处（例如客户的公司文件夹），写成最后一项。

      参考 specs 看文书必须满足什么，参考 design 看怎么做。
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    读计划文件，按 tasks.md 逐项执行，完成一项勾选一项。
    只执行【我方】项目；遇到未完成的【客户】或【官方】项目不要勾选，报告在等谁、等什么，然后暂停。
    正式版保存到 documents/<工作名>/，草稿留在工作文件夹。遇到问题或需要确认时暂停。
